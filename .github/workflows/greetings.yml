name: Greetings
on: [pull_request, issues]
jobs:
  greeting:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
    - uses: actions/first-interaction@v1
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: "환영합니다! 첫 이슈를 만들어 주셔서 감사합니다 🎉"
          pr-message: "환영합니다! 첫 PR을 만들어 주셔서 감사합니다 🎉"
